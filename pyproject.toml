[project]
name = "agentops"
version = "0.1.0"
description = "本地 agent 研发流水线套件：工作项、会话、合并队列、steward、看板"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ao = "agentops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
